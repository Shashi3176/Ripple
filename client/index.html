<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Ripple - Anonymous chat rooms and random chat. Connect with strangers safely, moderated, and temporary. No profiles, no judgment." />
    <meta name="keywords" content="anonymous chat, random chat, chat rooms, omegle alternative, anonymous messaging, stranger chat" />
    <meta name="author" content="Ripple" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ripple.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ripple.com/" />
    <meta property="og:title" content="Ripple - Anonymous Chat Rooms & Random Chat" />
    <meta property="og:description" content="Connect anonymously with strangers worldwide. Safe, moderated chat rooms with no profiles, no judgment." />
    <meta property="og:image" content="https://ripple.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Ripple" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ripple.com/" />
    <meta name="twitter:title" content="Ripple - Anonymous Chat Rooms" />
    <meta name="twitter:description" content="Connect anonymously with strangers. Safe, moderated, temporary chat rooms." />
    <meta name="twitter:image" content="https://ripple.com/twitter-card.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ripple",
        "description": "Anonymous chat rooms and random 1-on-1 chat. Connect with strangers safely and temporarily.",
        "url": "https://ripple.com",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "1240"
        }
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#6366f1" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Ripple - Anonymous Chat Rooms & Random Chat</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
